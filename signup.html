<!DOCTYPE html>
<html>
<head>
<title>Signup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background: linear-gradient(135deg, #1f2a48, #0b0f1a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container-box{
    text-align:center;
}

.option-btn{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
}

.option-btn:hover{
    background:#00d4ff;
    color:black;
}

.signup-box{
    width:350px;
    margin:auto;
    margin-top:20px;
    padding:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius:15px;
    display:none;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    background:rgba(255,255,255,0.1);
    color:white;
}

input::placeholder{
    color:#ccc;
}

.signup-btn{
    width:100%;
    padding:10px;
    background:#00d4ff;
    border:none;
    color:black;
    border-radius:8px;
}

a{
    color:#ccc;
    text-decoration:none;
}

</style>

<script>
function showSignup(role){
    document.getElementById("signupBox").style.display="block";
    document.getElementById("roleInput").value = role;
    document.getElementById("roleTitle").innerText = role.toUpperCase() + " SIGNUP";

    // ✅ SHOW only for patient
    if(role === "patient"){
        document.getElementById("extraFields").style.display = "block";
    } else {
        document.getElementById("extraFields").style.display = "none";
    }
}
</script>

</head>

<body>

<div class="container-box">

    <h2>Create Account</h2>

    <button class="option-btn" onclick="showSignup('patient')">Patient</button>
    <button class="option-btn" onclick="showSignup('doctor')">Doctor</button>

    <div class="signup-box" id="signupBox">

        <h4 id="roleTitle"></h4>

        <form method="POST">

            <input type="hidden" name="role" id="roleInput">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <div id="extraFields">
                <input type="text" name="phone" placeholder="Phone Number">
                <input type="date" name="dob">
            </div>

            <button class="signup-btn">Signup</button>

            <a href="/login" class="d-block mt-3">Back to Login</a>
            <a href="/" class="d-block mt-2">⬅ Back to Home</a>

        </form>

    </div>

</div>

</body>
</html>
