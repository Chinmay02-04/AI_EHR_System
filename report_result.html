<!DOCTYPE html>
<html>
<head>
    <title>Report Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">🧾 Prediction Result for {{ name }}</h2>

    <!-- Uploaded Report -->
    <div class="card p-4 mb-4">
        <h5>Uploaded Report:</h5>
        <a href="/uploads/{{ filename }}" target="_blank" class="btn btn-primary">View Report File</a>
    </div>

    <!-- Metrics Chart -->
    <div class="card p-4">
        <h5>Prediction Metrics:</h5>
        <canvas id="metricsChart" height="150"></canvas>
    </div>
    <div class="alert alert-info mt-3">
    <h5>Risk Level: {{ level }}</h5>
</div>
    <a href="/patient" class="btn btn-secondary mt-4">Back to Dashboard</a>
</div>
<div class="card p-4 mt-4">
    <h5>Report Summary:</h5>
    <ul>
        {% for line in summary %}
            <li>{{ line }}</li>
        {% endfor %}
    </ul>



</div>
<script>
// Convert Python dict to JSON for JS
const metrics = JSON.parse('{{ metrics|tojson|safe }}');

const ctx = document.getElementById('metricsChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: Object.keys(metrics),
        datasets: [{
            label: 'Metrics',
            data: Object.values(metrics),
            backgroundColor: [
                'rgba(75, 192, 192, 0.6)',
                'rgba(255, 99, 132, 0.6)',
                'rgba(255, 206, 86, 0.6)',
                'rgba(153, 102, 255, 0.6)'
            ],
            borderColor: [
                'rgba(75, 192, 192, 1)',
                'rgba(255, 99, 132, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(153, 102, 255, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        scales: { y: { beginAtZero: true } }
    }

    

});
</script>

</body>
</html>
